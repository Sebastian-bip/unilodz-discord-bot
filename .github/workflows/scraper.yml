name: UniLodz Discord News Scraper

on:
  schedule:
    # Uruchamia się automatycznie 3 razy dziennie: 08:00, 12:00, 17:00 UTC
    # (09:00, 13:00, 18:00 czasu zimowego CET / 10:00, 14:00, 19:00 czasu letniego CEST)
    - cron: "0 8,12,17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Tryb uruchomienia"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - dry-run
          - init

permissions:
  contents: write

concurrency:
  group: unilodz-news-scraper
  cancel-in-progress: false

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Zainstaluj zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Uruchom scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_MODE: ${{ inputs.mode || 'normal' }}
        run: |
          if [ "$RUN_MODE" = "dry-run" ]; then
            python scraper.py --dry-run
          elif [ "$RUN_MODE" = "init" ]; then
            python scraper.py --init
          else
            python scraper.py
          fi

      - name: Zapisz stan seen_posts.json w repozytorium
        if: ${{ !cancelled() && (inputs.mode || 'normal') != 'dry-run' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet seen_posts.json; then
            git add seen_posts.json
            git commit -m "chore: update seen_posts.json [skip ci]"
            git push
          else
            echo "Brak zmian w seen_posts.json – pomijam commit."
          fi
